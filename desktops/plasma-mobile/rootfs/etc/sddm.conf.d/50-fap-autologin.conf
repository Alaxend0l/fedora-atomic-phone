# Straight into Plasma Mobile as `phone`. The dev-root builder creates that
# user (boot/android-bootimg/make-devroot.sh); the bootc image has no user
# yet (first-boot user creation is open, docs/status.md).
[Autologin]
User=phone
Session=plasma-mobile
# Log back in when the session ends (e.g. loginctl terminate-session).
Relogin=true
