# SPDX-License-Identifier: AGPL-3.0-or-later
# Weekly: re-resolve every lock target (tools/update/targets.yaml) against
# Fedora 45, and if anything changed, open or update a PR with the new
# lock/ and a Markdown diff (watched packages + what to test). The risk
# review with the local LLM runs on the maintainer's Mac:
# tools/update/review-pr.sh <pr> (docs/updates.md).
#
# Checks on the PR: a PR created with GITHUB_TOKEN doesn't trigger push
# workflows, so this dispatches ci.yml (lint, DTBs + kmods against the
# newest Fedora kernel = the compile-time kernel guard) and build.yml
# (pinned image build = dependency-conflict check) on the PR branch;
# workflow_dispatch is the exception GitHub allows. With an
# UPDATE_BOT_TOKEN secret (fine-grained PAT: contents + pull-requests
# write) the PR is opened with that token instead, so push-triggered
# checks run as for any other branch.
name: update

on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 1"          # Mondays 03:41 UTC, before ci.yml's weekly run

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: update
  cancel-in-progress: false

env:
  BRANCH: update/fedora-packages

jobs:
  update:
    runs-on: ubuntu-24.04-arm         # aarch64: resolve natively, as the phones run
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update -q && sudo apt-get install -y -q podman python3-yaml
      - name: Free disk space (base images are several GB each)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          df -h /
      - name: Re-lock and diff
        id: lock
        run: |
          mkdir -p out
          # Exit 3 = some target no longer resolves: still open the PR (it
          # says so at the top), fail the run at the end.
          rc=0
          tools/update/check-updates.py --write --prune-images \
              --json out/updates.json --markdown out/updates.md || rc=$?
          cat out/updates.md >> "$GITHUB_STEP_SUMMARY"
          [ "$rc" = 0 ] || [ "$rc" = 3 ] || exit "$rc"
          echo "unresolvable=$([ "$rc" = 3 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: updates
          path: out/
      - name: Changed?
        id: diff
        run: |
          if git diff --quiet -- lock/ && [ -z "$(git ls-files --others --exclude-standard lock/)" ]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
          else
              echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Open or update the PR
        if: steps.diff.outputs.changed == 'true'
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.UPDATE_BOT_TOKEN || github.token }}
          branch: ${{ env.BRANCH }}
          commit-message: |
            lock: weekly Fedora package update

            Generated by .github/workflows/update.yml (tools/update/check-updates.py).
          title: "lock: Fedora package updates"
          body-path: out/updates.md
          add-paths: lock/
          labels: dependencies
          delete-branch: true
      - name: Run checks on the PR branch
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci.yml --ref "$BRANCH"
          gh workflow run build.yml --ref "$BRANCH" -f pinned=true -f desktop=tty
      - name: Fail if a target no longer resolves
        if: steps.lock.outputs.unresolvable == 'true'
        run: |
          echo "::error::some lock targets no longer resolve; see the job summary / PR body"
          exit 1
