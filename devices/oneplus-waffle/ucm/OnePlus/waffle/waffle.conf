# SPDX-License-Identifier: BSD-3-Clause
# OnePlus 12 (waffle): ALSA UCM for the sm8650 sound card (driver "sm8650",
# name "OnePlus 12"); found as ucm2/conf.d/sm8650/OnePlus 12.conf (symlink).
# WCD9395 only (headphone outputs, analog mics). No speaker device: the
# TFA9874 amplifiers have no driver (devices/oneplus-waffle/README.md).
Syntax 4

SectionUseCase."HiFi" {
	File "/OnePlus/waffle/HiFi.conf"
	Comment "HiFi quality Music."
}

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.wcd-init.File "/codecs/wcd939x/init.conf"
Include.rxm-init.File "/codecs/qcom-lpass/rx-macro/init.conf"
