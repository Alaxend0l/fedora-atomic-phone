# OnePlus 12 (waffle) HiFi verb. Based on alsa-ucm-conf's
# Qualcomm/sm8650/QRD/HiFi.conf (same WCD9395 back ends, same AudioReach
# topology: hw:N,0 = MultiMedia1 -> RX_CODEC_DMA_RX_0, hw:N,2 = MultiMedia3
# <- TX_CODEC_DMA_TX_3), without the WSA884x speakers QRD has. Speakers:
# hw:N,1 = MultiMedia2 -> SECONDARY_MI2S_RX -> two TFA9874 (needs the
# speaker topology from build-env/tplg-build.sh and the -speakers DT).
#
# Gains are conservative on purpose: headphone PA at -9 dB (HPH Volume 14 of
# 20) instead of QRD's 0 dB. Which AMIC is which microphone on this phone is
# not known yet (no stock mixer_paths); Mic1/3/4/5 = WCD9395 AMIC1/3/4/5,
# the board DT's routing. AMIC2 is the USB-C headset mic (QRD "Headset").
# The capture PCM (MultiMedia3) only accepts 2 channels; with
# CaptureChannels 1 PipeWire's probe failed and dropped every HiFi profile
# (no sinks at all).

SectionVerb {
	EnableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='SECONDARY_MI2S_RX Audio Mixer MultiMedia2' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
		cset "name='HPHL Volume' 14"
		cset "name='HPHR Volume' 14"
	]

	Value {
		TQ "HiFi"
	}
}

# Earpiece (TFA9874 at 0x34, "SpkrTop") + bottom loudspeaker (0x35,
# "SpkrBot") as one stereo device, slots as on stock: earpiece = left,
# bottom = right. No boost converter, vendor analog gain (driver).
# Volume cap until there is speaker protection: the DSP stream volume of
# MultiMedia2 (linear, 8192 = 0 dB; ALSA truncates the control name) is
# held at 2048 = -12 dB, so 100 % in PipeWire is -12 dBFS at the amps.
SectionDevice."Speaker" {
	Comment "Speakers (earpiece + bottom)"

	EnableSequence [
		cset "name='stream1.vol_ctrl1 MultiMedia2 Playback Volu' 2048"
		cset "name='SpkrTop Amp Input' Left"
		cset "name='SpkrBot Amp Input' Right"
		cset "name='SpkrTop Amp Enable Switch' on"
		cset "name='SpkrBot Amp Enable Switch' on"
	]

	DisableSequence [
		cset "name='SpkrTop Amp Enable Switch' off"
		cset "name='SpkrBot Amp Enable Switch' off"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},1"
		PlaybackMixer "default:${CardId}"
	}
}

# WCD9395 headphone outputs. They reach the USB-C port only through the
# wcd939x-usbss switch, which the v6 DT leaves off, so nothing is audible
# yet; the device exists so the playback graph can be tested end to end.
SectionDevice."Headphones" {
	Comment "Headphones (USB-C analog)"

	Include.wcdhpe.File "/codecs/wcd939x/HeadphoneEnableSeq.conf"
	Include.wcdhpd.File "/codecs/wcd939x/HeadphoneDisableSeq.conf"
	Include.rxmhpe.File "/codecs/qcom-lpass/rx-macro/HeadphoneEnableSeq.conf"
	Include.rxmhpd.File "/codecs/qcom-lpass/rx-macro/HeadphoneDisableSeq.conf"

	Value {
		PlaybackChannels 2
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "HP"
		JackControl "Headphone Jack"
		JackHWMute "Speaker"
	}
}

SectionDevice."Mic1" {
	Comment "Microphone (AMIC1)"
	ConflictingDevice [ "Mic3" "Mic4" "Mic5" ]

	Include.wcdmice.File "/codecs/wcd939x/AnalogMic1EnableSeq.conf"
	Include.wcdmicd.File "/codecs/wcd939x/AnalogMicDisableSeq.conf"
	Include.txmmice.File "/codecs/qcom-lpass/tx-macro/SoundwireMic0EnableSeq.conf"
	Include.txmmicd.File "/codecs/qcom-lpass/tx-macro/SoundwireMicDisableSeq.conf"

	Value {
		CaptureChannels 2
		CapturePriority 200
		CapturePCM "hw:${CardId},2"
		CaptureMixerElem "ADC1"
	}
}

SectionDevice."Mic3" {
	Comment "Microphone (AMIC3)"
	ConflictingDevice [ "Mic1" "Mic4" "Mic5" ]

	Include.wcdmice.File "/codecs/wcd939x/AnalogMic3EnableSeq.conf"
	Include.wcdmicd.File "/codecs/wcd939x/AnalogMicDisableSeq.conf"
	Include.txmmice.File "/codecs/qcom-lpass/tx-macro/SoundwireMic0EnableSeq.conf"
	Include.txmmicd.File "/codecs/qcom-lpass/tx-macro/SoundwireMicDisableSeq.conf"

	Value {
		CaptureChannels 2
		CapturePriority 150
		CapturePCM "hw:${CardId},2"
		CaptureMixerElem "ADC1"
	}
}

SectionDevice."Mic4" {
	Comment "Microphone (AMIC4)"
	ConflictingDevice [ "Mic1" "Mic3" "Mic5" ]

	Include.wcdmice.File "/codecs/wcd939x/AnalogMic4EnableSeq.conf"
	Include.wcdmicd.File "/codecs/wcd939x/AnalogMicDisableSeq.conf"
	Include.txmmice.File "/codecs/qcom-lpass/tx-macro/SoundwireMic0EnableSeq.conf"
	Include.txmmicd.File "/codecs/qcom-lpass/tx-macro/SoundwireMicDisableSeq.conf"

	Value {
		CaptureChannels 2
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureMixerElem "ADC1"
	}
}

SectionDevice."Mic5" {
	Comment "Microphone (AMIC5)"
	ConflictingDevice [ "Mic1" "Mic3" "Mic4" ]

	Include.wcdmice.File "/codecs/wcd939x/AnalogMic5EnableSeq.conf"
	Include.wcdmicd.File "/codecs/wcd939x/AnalogMicDisableSeq.conf"
	Include.txmmice.File "/codecs/qcom-lpass/tx-macro/SoundwireMic0EnableSeq.conf"
	Include.txmmicd.File "/codecs/qcom-lpass/tx-macro/SoundwireMicDisableSeq.conf"

	Value {
		CaptureChannels 2
		CapturePriority 50
		CapturePCM "hw:${CardId},2"
		CaptureMixerElem "ADC1"
	}
}
