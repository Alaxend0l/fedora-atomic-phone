# OnePlus 12 (waffle) HiFi verb. Based on alsa-ucm-conf's
# Qualcomm/sm8650/QRD/HiFi.conf (same WCD9395 back ends, same AudioReach
# topology: hw:N,0 = MultiMedia1 -> RX_CODEC_DMA_RX_0, hw:N,2 = MultiMedia3
# <- TX_CODEC_DMA_TX_3), without the WSA884x speakers QRD has. Speakers:
# hw:N,1 = MultiMedia2 -> SECONDARY_MI2S_RX -> two TFA9874 (needs the
# speaker topology from build-env/tplg-build.sh and the -speakers DT).
#
# Gains are conservative on purpose: headphone PA at -9 dB (HPH Volume 14 of
# 20) instead of QRD's 0 dB. Microphones as stock uses them (stock
# mixer_paths/resourcemanager, 2026-11-21): Mic1 = bottom (AMIC1), Mic2 =
# top near the camera (AMIC5), Mic3 = both (stereo, for echo-cancel / noise
# suppression); AMIC3/4 are unused on stock, AMIC2 is the USB-C headset mic.
# The sequences are inline: alsa-ucm-conf's codecs/wcd939x AnalogMic*Seq set
# "TX0 MODE" to ADC_ULP, which this codec does not have (ADC_ULP1/ULP2), so
# the mode silently stayed ADC_INVALID.
# The capture PCM (MultiMedia3) only accepts 2 channels; with
# CaptureChannels 1 PipeWire's probe failed and dropped every HiFi profile
# (no sinks at all).

SectionVerb {
	EnableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='SECONDARY_MI2S_RX Audio Mixer MultiMedia2' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
		cset "name='HPHL Volume' 14"
		cset "name='HPHR Volume' 14"
	]

	Value {
		TQ "HiFi"
	}
}

# Earpiece (TFA9874 at 0x34, "SpkrTop") + bottom loudspeaker (0x35,
# "SpkrBot") as one stereo device, slots as on stock: earpiece = left,
# bottom = right. No boost converter, vendor analog gain (driver).
# Volume cap until there is speaker protection: the DSP stream volume of
# MultiMedia2 (linear, 8192 = 0 dB; ALSA truncates the control name) is
# held at 2048 = -12 dB, so 100 % in PipeWire is -12 dBFS at the amps.
SectionDevice."Speaker" {
	Comment "Speakers (earpiece + bottom)"

	EnableSequence [
		cset "name='stream1.vol_ctrl1 MultiMedia2 Playback Volu' 2048"
		cset "name='SpkrTop Amp Input' Left"
		cset "name='SpkrBot Amp Input' Right"
		cset "name='SpkrTop Amp Enable Switch' on"
		cset "name='SpkrBot Amp Enable Switch' on"
	]

	DisableSequence [
		cset "name='SpkrTop Amp Enable Switch' off"
		cset "name='SpkrBot Amp Enable Switch' off"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},1"
		PlaybackMixer "default:${CardId}"
	}
}

# WCD9395 headphone outputs. They reach the USB-C port only through the
# wcd939x-usbss switch, which the v6 DT leaves off, so nothing is audible
# yet; the device exists so the playback graph can be tested end to end.
SectionDevice."Headphones" {
	Comment "Headphones (USB-C analog)"

	Include.wcdhpe.File "/codecs/wcd939x/HeadphoneEnableSeq.conf"
	Include.wcdhpd.File "/codecs/wcd939x/HeadphoneDisableSeq.conf"
	Include.rxmhpe.File "/codecs/qcom-lpass/rx-macro/HeadphoneEnableSeq.conf"
	Include.rxmhpd.File "/codecs/qcom-lpass/rx-macro/HeadphoneDisableSeq.conf"

	Value {
		PlaybackChannels 2
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "HP"
		JackControl "Headphone Jack"
		JackHWMute "Speaker"
	}
}

# Bottom main mic (stock "main mic", primary for handset/voice): AMIC1 ->
# ADC1 -> SWR_MIC0, into both decimators so both PCM channels carry it.
SectionDevice."Mic1" {
	Comment "Bottom microphone"
	ConflictingDevice [ "Mic2" "Mic3" ]

	EnableSequence [
		cset "name='ADC1 MUX' CH1_AMIC1"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC1 Volume' 10"
		cset "name='TX0 MODE' ADC_NORMAL"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC0"
		cset "name='TX DEC1 MUX' SWR_MIC"
		cset "name='TX SMIC MUX1' SWR_MIC0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
		cset "name='TX_DEC0 Volume' 100"
		cset "name='TX_DEC1 Volume' 100"
	]

	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='TX SMIC MUX1' ZERO"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='ADC1 Switch' 0"
		cset "name='ADC1 MUX' CH1_AMIC_DISABLE"
	]

	Value {
		CaptureChannels 2
		CapturePriority 300
		CapturePCM "hw:${CardId},2"
		CaptureMixerElem "ADC1"
	}
}

# Top mic near the camera (stock primary for speakerphone/camcorder): AMIC5
# through ADC1 (CH1_AMIC5 is valid; same proven SWR_MIC0 path), bias = MIC BIAS3.
SectionDevice."Mic2" {
	Comment "Top microphone"
	ConflictingDevice [ "Mic1" "Mic3" ]

	EnableSequence [
		cset "name='ADC1 MUX' CH1_AMIC5"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC1 Volume' 10"
		cset "name='TX0 MODE' ADC_NORMAL"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC0"
		cset "name='TX DEC1 MUX' SWR_MIC"
		cset "name='TX SMIC MUX1' SWR_MIC0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
		cset "name='TX_DEC0 Volume' 100"
		cset "name='TX_DEC1 Volume' 100"
	]

	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='TX SMIC MUX1' ZERO"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='ADC1 Switch' 0"
		cset "name='ADC1 MUX' CH1_AMIC_DISABLE"
	]

	Value {
		CaptureChannels 2
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureMixerElem "ADC1"
	}
}

# Both mics as stock's handset-mic / dual-mic endfire: left = bottom (AMIC1,
# ADC1, SWR_MIC0, DEC0), right = top (AMIC5, ADC4, SWR_MIC3, DEC1). Input
# for PipeWire echo-cancel / noise suppression in calls.
SectionDevice."Mic3" {
	Comment "Bottom + top microphones (stereo)"
	ConflictingDevice [ "Mic1" "Mic2" ]

	EnableSequence [
		cset "name='ADC1 MUX' CH1_AMIC1"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC1 Volume' 10"
		cset "name='TX0 MODE' ADC_NORMAL"
		cset "name='ADC4 MUX' CH4_AMIC5"
		cset "name='ADC4_MIXER Switch' 1"
		cset "name='ADC4 Switch' 1"
		cset "name='ADC4 Volume' 10"
		cset "name='TX3 MODE' ADC_NORMAL"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC0"
		cset "name='TX DEC1 MUX' SWR_MIC"
		cset "name='TX SMIC MUX1' SWR_MIC3"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
		cset "name='TX_DEC0 Volume' 100"
		cset "name='TX_DEC1 Volume' 100"
	]

	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='TX SMIC MUX1' ZERO"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='ADC1 Switch' 0"
		cset "name='ADC1 MUX' CH1_AMIC_DISABLE"
		cset "name='ADC4_MIXER Switch' 0"
		cset "name='ADC4 Switch' 0"
		cset "name='ADC4 MUX' CH4_AMIC_DISABLE"
	]

	Value {
		CaptureChannels 2
		CapturePriority 200
		CapturePCM "hw:${CardId},2"
	}
}
