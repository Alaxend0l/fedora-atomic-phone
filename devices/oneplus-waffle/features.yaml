# SPDX-License-Identifier: AGPL-3.0-or-later
# Feature status for OnePlus 12 (nothing booted yet: everything untested): the source of truth for what works
# (docs/features.md has the schema; docs/devices.md is generated from all
# devices' files by tools/support-matrix.py).
#
# This template is also the feature catalogue: groups, feature ids and their
# order, and each feature's `title`. Device files repeat groups and ids but
# leave out `title`. Adding a feature = add it here and to every device.
#
# status: works | partial | broken | untested | n-a
# notes: one line, what's missing or how it's worked around
# evidence: a repo path, a URL or a commit hash (where it was shown to work/fail)
schema: 1
