# OnePlus 12: system suspend as s2idle (tested 2026-11-21, pm_test stages and
# real s2idle with RTC/power-key wake: OnePlus12/log/2026-11-21-suspend-tests.md).
# The firmware also offers "deep" (PSCI SYSTEM_SUSPEND) and the kernel
# defaults to it, but it is untested here, so pin s2idle. No hibernation
# (no swap partition, and the boot path can't resume an image).
# Known limits: the SoC doesn't reach CX collapse yet (PCIe0 CESTA vote),
# calls/SMS can't wake the phone (no GLINK wake on mainline), and while
# charging battery-manager events end s2idle after a few seconds.
[Sleep]
AllowSuspend=yes
MemorySleepMode=s2idle
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
