# LPASS codec macros + the Qualcomm SoundWire controller. On the installed
# boot nothing autoloads them, so the WCD9395 never appears on SoundWire and
# the sound card defers ("WCD Playback: codec dai not found"); the RAM-boot
# netroot loaded them explicitly (2026-11-20).
snd-soc-lpass-va-macro
snd-soc-lpass-tx-macro
snd-soc-lpass-rx-macro
snd-soc-lpass-wsa-macro
soundwire-qcom
