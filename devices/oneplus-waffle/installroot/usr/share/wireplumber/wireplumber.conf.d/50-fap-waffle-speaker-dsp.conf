# OnePlus 12 (waffle): put the speaker protection filter in front of the UCM
# speaker sink and hide that raw sink from every client (as asahi-audio
# does), so no application can bypass the filter.
wireplumber.profiles = {
  main = {
    node.software-dsp = required
  }
}

node.software-dsp.rules = [
  {
    matches = [
      { node.name = "alsa_output.platform-sound.HiFi__Speaker__sink" }
    ]
    actions = {
      create-filter = {
        hide-parent = true
        # The filter graph (filter-chain arguments, inline: filter-path failed to
        # load on WirePlumber 0.5.19 without a reason in the log). Left = earpiece
        # (TFA9874 0x34), right = bottom loudspeaker (0x35).
        # Research: ~/Develop/OnePlus12/log/2026-11-21-research-speaker-protection.md (stage 0).
        #   - 4th-order Butterworth high-pass per channel (two biquads, Q 0.541 and
        #     1.307): earpiece 400 Hz, bottom 300 Hz (later: ~0.5 x measured F0);
        #   - earpiece trim -6 dB (it is a receiver, at the ear during calls);
        #   - look-ahead peak limiter at -3 dB, channels linked;
        #   - RMS compressor (thermal): -12 dB threshold, ratio 10, 50 ms / 1 s.
        # Below: UCM caps the DSP stream volume at -12 dB; amps without boost.
        filter-graph = {
          node.description = "Speakers"
          media.name       = "Speakers"
          filter.graph = {
              nodes = [
                  { type = builtin label = bq_highpass name = hpL1 control = { "Freq" = 400.0 "Q" = 0.541 } }
                  { type = builtin label = bq_highpass name = hpL2 control = { "Freq" = 400.0 "Q" = 1.307 } }
                  { type = builtin label = bq_highpass name = hpR1 control = { "Freq" = 300.0 "Q" = 0.541 } }
                  { type = builtin label = bq_highpass name = hpR2 control = { "Freq" = 300.0 "Q" = 1.307 } }
                  { type = builtin label = linear      name = trimL control = { "Mult" = 0.5 "Add" = 0.0 } }
                  {   type = ladspa name = lim plugin = fast_lookahead_limiter_1913 label = fastLookaheadLimiter
                      control = { "Input gain (dB)" = 0.0 "Limit (dB)" = -3.0 "Release time (s)" = 0.15 }
                  }
                  {   type = ladspa name = comp plugin = sc4_1882 label = sc4
                      control = {
                          "RMS/peak" = 1.0 "Attack time (ms)" = 50.0 "Release time (ms)" = 1000.0
                          "Threshold level (dB)" = -12.0 "Ratio (1:n)" = 10.0
                          "Knee radius (dB)" = 3.0 "Makeup gain (dB)" = 0.0
                      }
                  }
              ]
              links = [
                  { output = "hpL1:Out"       input = "hpL2:In" }
                  { output = "hpL2:Out"       input = "trimL:In" }
                  { output = "trimL:Out"      input = "lim:Input 1" }
                  { output = "hpR1:Out"       input = "hpR2:In" }
                  { output = "hpR2:Out"       input = "lim:Input 2" }
                  { output = "lim:Output 1"   input = "comp:Left input" }
                  { output = "lim:Output 2"   input = "comp:Right input" }
              ]
              inputs  = [ "hpL1:In" "hpR1:In" ]
              outputs = [ "comp:Left output" "comp:Right output" ]
          }
          audio.channels = 2
          audio.position = [ FL FR ]
          capture.props = {
              node.name        = "fap.speaker-protect"
              media.class      = Audio/Sink
              priority.session = 2000
              priority.driver  = 2000
          }
          playback.props = {
              node.name         = "fap.speaker-protect.out"
              node.passive      = true
              target.object     = "alsa_output.platform-sound.HiFi__Speaker__sink"
              stream.dont-remix = true
          }
        }
      }
    }
  }
]
