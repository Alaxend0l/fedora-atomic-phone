# OnePlus 12 (waffle): static protection for the two speakers (TFA9874,
# earpiece = left, bottom loudspeaker = right). Stock Android runs NXP's
# speaker-protection algorithm in the ADSP with live current/voltage
# sense; we don't have that, so this filter stands in front of the
# speakers until a thermal/excursion model exists:
#   - 4th-order Butterworth high-pass at 200 Hz (two biquads, Q 0.541 and
#     1.307): phone speakers can't reproduce deep bass, and bass excursion
#     is what damages them;
#   - look-ahead limiter at -3 dB, both channels linked (no image shift).
# Below it, the UCM "Speaker" device keeps the DSP stream volume at -12 dB
# and the amps run without boost (driver). Needs ladspa-swh-plugins.
#
# The virtual sink "Speakers (protected)" outranks the raw speaker sink, so
# it becomes the default; it plays into the UCM speaker sink by name.
context.modules = [
    {   name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Speakers (protected)"
            media.name       = "Speakers (protected)"
            filter.graph = {
                nodes = [
                    { type = builtin label = bq_highpass name = hpL1 control = { "Freq" = 200.0 "Q" = 0.541 } }
                    { type = builtin label = bq_highpass name = hpL2 control = { "Freq" = 200.0 "Q" = 1.307 } }
                    { type = builtin label = bq_highpass name = hpR1 control = { "Freq" = 200.0 "Q" = 0.541 } }
                    { type = builtin label = bq_highpass name = hpR2 control = { "Freq" = 200.0 "Q" = 1.307 } }
                    {   type   = ladspa
                        name   = lim
                        plugin = fast_lookahead_limiter_1913
                        label  = fastLookaheadLimiter
                        control = { "Input gain (dB)" = 0.0 "Limit (dB)" = -3.0 "Release time (s)" = 0.15 }
                    }
                ]
                links = [
                    { output = "hpL1:Out" input = "hpL2:In" }
                    { output = "hpR1:Out" input = "hpR2:In" }
                    { output = "hpL2:Out" input = "lim:Input 1" }
                    { output = "hpR2:Out" input = "lim:Input 2" }
                ]
                inputs  = [ "hpL1:In" "hpR1:In" ]
                outputs = [ "lim:Output 1" "lim:Output 2" ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name        = "fap.speaker-protect"
                media.class      = Audio/Sink
                priority.session = 2000
                priority.driver  = 2000
            }
            playback.props = {
                node.name       = "fap.speaker-protect.out"
                node.passive    = true
                target.object   = "alsa_output.platform-sound.HiFi__Speaker__sink"
                stream.dont-remix = true
            }
        }
    }
]
