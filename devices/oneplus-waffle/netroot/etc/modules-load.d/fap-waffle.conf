# QRTR and the in-kernel PD mapper: the DSPs (ADSP for pmic-glink/battery,
# CDSP, modem) need them before their services come up. Nothing binds these
# from the DT, so udev won't load them.
qrtr
qrtr-smd
qcom_pd_mapper
# Mobile data: IPA (DT node from the board DT, GSI firmware ipa_fws from the
# unit's modem_a) gives rmnet_ipa0; ModemManager adds rmnet links on top.
# udev loads ipa from the DT as well; listed so it's there before MM probes.
ipa
rmnet
