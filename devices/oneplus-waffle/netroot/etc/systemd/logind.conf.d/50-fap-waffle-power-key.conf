# Short power key press: let the desktop handle it (Plasma Mobile locks and
# blanks the screen) instead of logind's default poweroff; long press is
# the PMIC's hard reset anyway.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
HandleSuspendKey=ignore
