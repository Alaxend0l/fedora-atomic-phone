# OnePlus 12: suspend (s2idle) is untested and the RAM boot's only link is
# the USB gadget (and Wi-Fi/PCIe is a crash suspect around power
# transitions, audit F1). Until the staged /sys/power/pm_test runs in
# POWER.md pass, logind reports CanSuspend=no, so Plasma/powerdevil never
# suspend on idle, lid or the power key. To test by hand, remove this file
# and `systemctl daemon-reload` (RAM root: gone at reboot).
[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
