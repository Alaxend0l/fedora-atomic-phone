# OnePlus 12 netroot: start ModemManager after the modem's EFS server, so the
# QRTR modem node appears soon after MM's bus watcher starts (MM also picks
# it up later; this only keeps the boot log tidy). No hard dependency: MM
# still runs on roots without the EFS copies.
[Unit]
After=fap-rmtfs.service
Wants=fap-rmtfs.service
