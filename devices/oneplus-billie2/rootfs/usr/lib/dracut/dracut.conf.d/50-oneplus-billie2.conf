# Fedora's generic initramfs already carries the SM6115 clock, pinctrl,
# interconnect, regulator and UFS drivers, but not rpmpd (RPM power domains).
# UFS doesn't need it (it uses GCC_UFS_PHY_GDSC), but the SD card, display and
# GPU do; including it avoids surprises if root ever lives on the SD card.
add_drivers+=" rpmpd "
