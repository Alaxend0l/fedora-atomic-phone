# Waydroid defaults for the N100 (read by fap-waydroid-init from the opt-in
# layers/waydroid). UBWC off in Android's Mesa too: the same SM6115 UBWC
# mismatch as on the host (FD_MESA_DEBUG=noubwc, ./build).
WAYDROID_DENSITY=320            # what OxygenOS used
WAYDROID_MESA_DEBUG=noubwc
