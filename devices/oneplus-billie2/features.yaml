      status: partial
      notes: "voltage-based estimate from the vendor OCV table (kmod/adc-ocv-battery), read-only"
      evidence: kmod/adc-ocv-battery/README.md
    charging:
      status: partial
      notes: "status guessed from USB input voltage; Linux doesn't drive the PMI632 charger (never bind qcom_smbx: 4.87 V)"
      evidence: docs/hardware/n100-charging-usb.md
    fast-charging:
      status: broken
      notes: "no charger control"
      evidence: docs/hardware/n100-charging-usb.md
  sensors:
    vibrator:
      status: works
