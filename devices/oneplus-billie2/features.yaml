# OnePlus Nord N100 feature status: the source of truth (schema:
# docs/features.md; docs/devices.md is generated from this by
# tools/support-matrix.py). Filled from TODO.md and docs/status.md, 2026-11-20.
# TODO.md keeps the prioritised work list; keep the two in step.
schema: 1
device: oneplus-billie2
updated: 2026-11-20
features:
  core:
    ram-boot:
      status: works
      notes: "fastboot boot of make-ramboot.sh images, with netroot or the installed root (fap.root=); needs a fresh ABL session per attempt"
      evidence: boot/android-bootimg/README.md
    boot-storage:
      status: works
      notes: "ABL normal-boots boot_a with dtbo_a erased; plain ext4 root on userdata (not bootc yet)"
      evidence: 2c68e81
    usb-gadget:
      status: works
      notes: "serial + NCM network (172.16.42.1); on normal boot since qcom,select-utmi-as-pipe-clk (image v3)"
      evidence: 02fa6df
    cpufreq:
      status: works
      notes: "qcom-cpufreq-hw, 0.3-1.8 GHz"
      evidence: e50bb83
    thermal:
      status: partial
      notes: "16 zones read; CPU zones have no cooling maps, so only the 110 C critical trip acts"
      evidence: devices/oneplus-billie2/hidden-dependencies.md
    suspend:
      status: untested
      notes: "s2idle not tried; plan needs MPM / system sleep state (docs/hardware/n100-power-and-install.md A2)"
      evidence: docs/hardware/n100-power-and-install.md
    reboot-bootloader:
      status: broken
      notes: "`reboot bootloader` doesn't reach fastboot; needs the PON reboot-mode for bootloader"
      evidence: devices/oneplus-billie2/TODO.md
    crash-logs:
      status: untested
      notes: "ramoops in the mainline DT, pstore mounts; no crash captured yet to prove it"
      evidence: e50bb83
  display:
    display:
      status: works
      notes: "MSM DRM + our generated ILI9882N panel driver, 720x1600 60 Hz; no LCDB driver (no panel power-off), 90 Hz not exposed"
      evidence: devices/oneplus-billie2/kmod/panel-ili9882n/README.md
    backlight:
      status: works
      notes: "DCS backlight, 0-2047"
      evidence: 8505e57
    gpu:
      status: partial
      notes: "Adreno 610 (freedreno) with the phone's zap shader and DDR votes; UBWC off (FD_MESA_DEBUG=noubwc) or tiles corrupt"
      evidence: 02fa6df
    video-codec:
      status: broken
      notes: "Venus not enabled in the DT; firmware on modem_a"
      evidence: docs/hardware/n100-gpu-video-display.md
  input:
    keys:
      status: works
      notes: "power, volume up/down via PMIC nodes in our DT (evtest)"
      evidence: 343b854
    touchscreen:
      status: works
      notes: "our ili9882n-ts SPI driver as DRM panel follower; firmware from the phone; suspend/resume untested"
      evidence: kmod/ili9882n-ts/README.md
  connectivity:
    wifi:
      status: partial
      notes: "ath10k WCN3990 via the modem (RAM-only rmtfs); startup needs retries, random MAC per boot, generic board data"
      evidence: devices/oneplus-billie2/hidden-dependencies.md
    bluetooth:
      status: broken
      notes: "WCN3988 on UART SE3 (hci_qca) not in the DT yet"
      evidence: docs/hardware/n100-telephony-bt-gnss.md
    usb-host:
      status: broken
      notes: "PMI632 Type-C + VBUS not in the DT yet (DT-only work)"
      evidence: docs/hardware/n100-charging-usb.md
    tethering:
      status: untested
      notes: "Wi-Fi works; NetworkManager hotspot not tried"
      evidence: ""
    nfc:
      status: untested
      notes: "README lists NXP nq-nci, TODO says probably not fitted: verify"
      evidence: devices/oneplus-billie2/README.md
  audio:
    speaker:
      status: broken
      notes: "no sound card yet (ADSP + LPASS + WCD937x); AW87529 amp can damage the speaker: follow the plan"
      evidence: docs/hardware/n100-audio.md
    earpiece:
      status: broken
      notes: "no sound card yet; AW87359 amp"
      evidence: docs/hardware/n100-audio.md
    headphones:
      status: broken
      notes: "no sound card yet"
      evidence: docs/hardware/n100-audio.md
    microphone:
      status: broken
      notes: "no sound card yet; a PipeWire null sink keeps apps from crashing"
