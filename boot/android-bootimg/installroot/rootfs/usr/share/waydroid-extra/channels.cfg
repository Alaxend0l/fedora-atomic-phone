# Waydroid's official OTA channels (https://docs.waydro.id/usage/install-on-desktops).
# Fedora's package ships them empty (waydroid.spec %build), so `waydroid init`
# and the GUI initializer would need -c/-v every time. Read by
# tools/config/load.py:load_channels(). The images come from SourceForge.
[channels]
system_channel = https://ota.waydro.id/system
vendor_channel = https://ota.waydro.id/vendor
