# Fedora's waydroid package pulls in dev-binderfs.mount (Wants=) but doesn't
# order after it, so the service's ExecStartPre symlinks (/dev/binder,
# /dev/hwbinder, /dev/vndbinder -> /dev/binderfs/...) can race the mount. If
# Waydroid then finds no /dev/binder it allocates "anbox-binder" nodes and
# saves those names in waydroid.cfg, which breaks after the next reboot
# (waydroid/waydroid#2422). Our kernel has binder only as binderfs (Rust
# binder, built in), so require the mount and start after it.
[Unit]
Requires=dev-binderfs.mount
After=dev-binderfs.mount
