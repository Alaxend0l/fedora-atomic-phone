# The N100 has no sound card under mainline yet (docs/hardware/n100-audio.md).
# With no audio device at all some apps crash when opening audio (VLC's
# PipeWire output segfaults in MuteSet). A null sink gives them somewhere to
# play to; remove this once the real sound card exists.
context.objects = [
    { factory = adapter
      args = {
          factory.name     = support.null-audio-sink
          node.name        = "fap-null-sink"
          node.description = "No audio device (placeholder)"
          media.class      = "Audio/Sink"
          audio.position   = [ FL FR ]
          priority.session = 1
      }
    }
]
